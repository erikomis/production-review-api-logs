spring.application.name=logs-production-review
server.port=${PORT:8089}

# ---------- MongoDB ----------
# Credenciais só pelo ambiente. Ex.: mongodb://usuario:senha@localhost:27017/logs-production-review?authSource=admin
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/logs-production-review}
spring.data.mongodb.auto-index-creation=true

# ---------- Kafka ----------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
logs.kafka.topic=${KAFKA_TOPIC:production-review-api}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:logs-production-review}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
# produtor usado apenas para publicar na DLT (production-review-api.DLT)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# ---------- API interna ----------
# Sem token configurado a API recusa todas as requisições em /api/v1/** (fail closed).
logs.api.token=${LOGS_API_TOKEN:}

# ---------- Actuator ----------
# porta só de gerenciamento (8090), não publicada: /actuator/prometheus fica na rede interna
management.server.port=${MANAGEMENT_PORT:8090}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}
