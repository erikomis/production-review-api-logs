# Serviço de logs + MongoDB. O Kafka é o mesmo usado pela API principal:
# informe-o em KAFKA_BOOTSTRAP_SERVERS (e ajuste a rede "broker-kafka" se ele estiver em outro compose).
#   cp .env.example .env   # preencha as variáveis
#   docker compose up -d --build

services:
  logs:
    build: .
    # imagem privada no GitHub Container Registry; o deploy define IMAGE_TAG=sha-<commit>
    # (localmente, `docker compose up -d --build` builda a partir do Dockerfile)
    image: ghcr.io/erikomis/production-review-api-logs:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "8089:8089"
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:?defina MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD:?defina MONGO_ROOT_PASSWORD}@mongo:27017/logs-production-review?authSource=admin
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      LOGS_API_TOKEN: ${LOGS_API_TOKEN:?defina LOGS_API_TOKEN}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8089 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - broker-kafka

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?defina MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?defina MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: logs-production-review
    volumes:
      - mongodb_data:/data/db
    networks:
      - broker-kafka

networks:
  broker-kafka:
    driver: bridge

volumes:
  mongodb_data:
